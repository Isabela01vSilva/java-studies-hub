<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="pare()">Pare</button>
    <button onclick="pense()">Pense</button>
    <button onclick="siga()">Siga</button>
    <div id="mensagem"></div>
</body>
</html>
<script>
    function pare(){
    mensagem.innerHTML=' <span style= background:red;color:white>Pare e aguarde!</span>';
    }function pense(){
    mensagem.innerHTML = '<span style = background:black;color:yellow>Pense se pode seguir ou se deve parar</span> '
    }function siga(){
    mensagem.innerHTML = '<span style = color:green>Pode seguir adiante :)</span>'
    }
</script>
