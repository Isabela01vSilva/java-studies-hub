<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="contando()">Conte de 99 a 1</button><br>
    <div id="mensagem"></div>
</body>
</html>
<script>
    function contando(){
        mensagem.innerHTML='';
        var contador;
        for( contador = 99 ; contador >=1; contador-- ){
            mensagem.innerHTML += `${contador}<br>`;
        }
    }
</script>
