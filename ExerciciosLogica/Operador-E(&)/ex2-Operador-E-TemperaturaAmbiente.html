<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperatura do ambiente </title>
</head>
<body>
    Qual é a temperatura <input type="text" id="temperatura"><br>
    <button onclick="medir()">Medir conforto</button>

<script>
    function medir(){
        if(temperatura.value >= 22 & temperatura.value <= 23){
            alert("Temperatura confortavel");
        }else {
            alert("Temperatura não está favoravel");
        }
    }
</script>
