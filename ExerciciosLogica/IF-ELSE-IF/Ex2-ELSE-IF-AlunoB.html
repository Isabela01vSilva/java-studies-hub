<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classificar Aluno</title>
</head>
<body>
    Digite sua nota <input type="text" id="notaInformada"><br>
    <button onclick="Aluno()">Classificar Aluno</button><br>
    <div id="mensagem"></div>
</body>
</html>
<script>
    function Aluno(){
        var nota = Number(notaInformada.value);
    if(nota < 5){
    mensagem.innerHTML="<span style=color:red>Aluno precisa de muita ajuda</span>";
    }
    else if (nota >= 5 ){
    mensagem.innerHTML="<span style=color:orange>Aluno na média</span>";
      }
    if(nota >= 7){
    mensagem.innerHTML="<span style=color:green>Aluno à acima da média</span>";
    } 
    if(nota >= 9.5){
    mensagem.innerHTML="<span style=color:blue>Aluno fora da curva</span>";
    }
}
</script>
