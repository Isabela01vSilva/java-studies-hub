<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Informar um valor de ano <input type="text" id="ano"><br>
    <button onclick="ver()">Ver Fato</button>
    <div id="mensagem"></div>
</body>
</html>
<script>
    function ver(){
        if(ano.value < 1965){
            mensagem.innerHTML=`No ano ${ano.value} o email nem havia sido criado ainda ...`;
        }
        if(ano.value == 1965){
            mensagem.innerHTML=`No ano ${ano.value} o email estava sendo criado ...`;
        }
        if(ano.value > 1965){
            mensagem.innerHTML=`No ano ${ano.value} o email já havia sido criado ...`;
        }
        if(ano.value >= 1969){
            mensagem.innerHTML=`No ano ${ano.value} o email já havia sido aprimorado - Poderia ser enviado para outro computador ...`;
        }
    }
</script>
