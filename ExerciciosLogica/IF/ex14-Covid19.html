<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   Distancia da sua casa <input type="text" id="distanciaCasa"><br>
    <button onclick="calculando()">Rola a pizza?</button> <br>
    <div id="mensagem"></div>
</body>
</html>
<script>
    function calculando(){
     var distancia = Number(distanciaCasa.value);
     if(distancia > 25){
         mensagem.innerHTML = `A Pizza Rãti não entrega neste endereço!`;
     }
     if(distancia <= 25 ){
       if (distancia >= 5) {
         mensagem.innerHTML = `A sua pizza será entregue, porém o valor de entrega é de R$ 25,00`;
        }
     }
     if (distancia < 5) {
         mensagem.innerHTML = `A sua pizza será entregue e não custará nada para você :)`;
     }
    }
</script>
