<html lang="en">
<head>

<body>
    Quantas latinha de refrigerante toma por dia <input type="text" id="dia"><br>
    <button onclick="quantos()">Quantos refris?</button> <br>
    <div id="mensagem"></div>
</body>
</html>
<script>
    function quantos(){
        var QuantidadeDia =Number(dia.value);
        var quantidade = 365 *QuantidadeDia;

        if(quantidade >= 500){
         mensagem.innerHTML+=`Está é a quantidade que vc toma por ano:${quantidade}<br> `;
         mensagem.innerHTML+=`Cuidado com a diabetes!<br>`;
        }
        mensagem.innerHTML+=`Está é a quantidade que vc toma por ano:${quantidade}<br> `;
    }
</script>
