<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Digite sua altura <input type="text" id="digaltura"><br>
    <button onclick="analisar()">Analisar para esportes</button><br>
    <div id="mensagem"></div>
</body>
</html>
<script>
    function analisar(){
    var altura = digaltura.value >= 1.60 && digaltura.value <= 1.85; 
    var alturas = digaltura.value < 1.60;
    var maltura = digaltura.value > 1.85;

    if(altura){
        mensagem.innerHTML= 'pode tentar ser jogador de futebol ou handebol'
    }
    if(alturas){
        mensagem.innerHTML = 'Pode tentar ser piloto(a) de corrida'
    }
    if(maltura){
        mensagem.innerHTML = 'Pode tentar ser jogador de basquete'
    }
    else if(!altura){
        mensagem.innerHTML='Pode ser pilota(o) de corrida<br>'
    }
}
</script>
