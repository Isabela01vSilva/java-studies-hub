<body>
    <h2>Ghost,dooutro lado da vida</h2>
    <input type="text" id="qtdelefante"><br>
    <button onclick="atazanar()">Atazanar a médium</button><br>
    <div id="mensagem"></div>
</body>

<script>
    function atazanar(){
        var contador = 1;
        mensagem.innerHTML="";
        while(contador++ < qtdelefante.value){
            var elefante = 0; 
            mensagem.innerHTML += "1 elefante incomoda muita gente!<br>";
            mensagem.innerHTML += `${contador} elefantes,`;
          
            while(elefante++ < contador){
                mensagem.innerHTML += "incomoda,";
            }
                mensagem.innerHTML += "muito mais <br><br>"
        }
    }
</script>
