<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <select id="numeros" onchange="escolha()">
        <option value="nada">Qual tabuada quer ver?</option>
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
    </select><br>
  <div id="mensagem"></div>
</body>
</html>
<script>
    function escolha(){
        var contador = 0;
        mensagem.innerHTML="";
        while(contador <= 9){
            ++contador;
            var conta = contador * numeros.value;
            if(conta % 2 == 0){
            mensagem.innerHTML+=`<span style=color:blue>${numeros.value} x ${contador} = ${conta}</span><br>`;  
            }else{
            mensagem.innerHTML+=`<span style=color:red>${numeros.value} x ${contador} = ${conta}</span><br>`;   
            }
        }
        if(numeros.value == 'nada'){
            mensagem.innerHTML = "Escolha um número";
        }
    }
</script>
