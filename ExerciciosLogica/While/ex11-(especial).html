<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="curto()">Curto 3 e 5!</button><br>
    <div id="mensagem"></div>
</body>
</html>
<script>
    function curto(){
        var contador = 0;
        mensagem.innerHTML="";
        while(contador < 100){
            ++ contador;
            
            if(contador % 3 == 0 && contador % 5 == 0) {
                mensagem.innerHTML += `<b>É TRI!É PENTA</b><br>`;
            }else if(contador % 3 == 0){
                mensagem.innerHTML += `<b>É tri</b><br>`;
            }else if(contador % 5 == 0){
                mensagem.innerHTML += `<b>É penta<b><br>`;
            } 
            else{
                mensagem.innerHTML += `${contador}<br>`;
            }
        }
    }
</script>
