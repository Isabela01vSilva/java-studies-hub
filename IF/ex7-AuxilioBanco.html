<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Renda familiar <input type="text" id="RendaFamilia"><br>
    Valor da prestação <input type="text" id="valorPrestacao"> <br>
    <button onclick="verificar()">Verificar Financiamento</button>
    <div id="mensagem"></div>
</body>
</html>
<script>
    function verificar(){
        var renda =Number(RendaFamilia.value);
        var prestacao =Number(valorPrestacao.value);
        var valor = (prestacao/renda)*100;
        mensagem.innerHTML=`${valor}`;
    }
</script>
