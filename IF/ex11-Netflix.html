<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   informe a hora que vc entra normalmente na plataforma <input type="text" id="HoraAcesso"> <br>
   <button oncanplay="ver()">Ver recomendação</button><br>
   <div id="mensagem"></div>
</body>
</html>
<script>
    function ver(){
        var tempo = Number(HoraAcesso.value);
        if(tempo > 19){
           if(tempo < 21){
            mensagem.innerHTML = `Não é recomendável que você assista sua série favorita no horário ${tempo}`;
           }
        }
        else {
            mensagem.innerHTML=`O horário ${tempo} é adequado para assistir sua série favorita!`;
        }
    }
</script>
