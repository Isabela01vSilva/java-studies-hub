<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="pares()">Eu S2 pares</button><br>
    <div id="mensagem"></div>
</body>
</html>
<script>
    function pares(){
        var contador = 0;
        mensagem.innerHTML = '';
        while(contador < 100){
        contador ++;
        if(contador % 2 == 0){
            mensagem.innerHTML += `${contador}<br> `;  
        }
    }
}
</script>
