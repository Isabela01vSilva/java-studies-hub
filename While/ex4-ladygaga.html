<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Qual o nome daa pessoa que mais ama na vida <input type="text" id="amor"><br>
    Quanto o usuario a ama (número inteiro) <input type="text" id="number"><br>
    <button onclick="expressar()">Expressar amor</button><br>
    <div id="mensagem"></div>
</body>
</html>
<script>
    function expressar(){
        var contador = 0;
        mensagem.innerHTML = '';
        while (contador < number.value) {
            contador++;
           mensagem.innerHTML += `<b>${amor.value}</b>,eu te amo!Sempre lembre disso!<br>`;
        }
    }
</script>
