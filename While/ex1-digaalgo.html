<body>
   <body>
    <button onclick="mostrar()">Diga algo sobre a quarentena</button>
    <div id="div_msg"></div>
</body>

<script>
    function mostrar() {
        var contador = 0;
        div_msg.innerHTML = '';
        while (contador < 7) {
            contador++;
            div_msg.innerHTML += `<br> ${contador} . que saco ficar em casa,né?`;
        }
    }
</script>
