<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Quantos números você pretende sortear: <input type="text" id="numero"><br>
    <button onclick="sortear()">Sortear número</button><br>
    <div id="mensagem"></div>
</body>
</html>
<script>
    function sortear(){
        var contador = 0;
        mensagem.innerHTML = 'Números sorteados:<br>';
        while(contador < numero.value){
        var numsorteado = parseInt(Math.random() * 101);
        contador ++;
        mensagem.innerHTML += `${numsorteado}<br>`;
        }
    }
</script>
