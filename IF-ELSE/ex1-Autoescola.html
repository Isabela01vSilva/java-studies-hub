<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Sua idade <input type="text" id="idade"> <br>
    <button onclick="avaliar()">Avaliar Aluno</button> <br>
    <div id="mensagem"></div>
</body>
</html>
<script>
    function avaliar(){
        if(idade.value >= 18){
            mensagem.innerHTML=`vamos tirar a CNH?`;
        }
        else if(idade.value < 18){
            mensagem.innerHTML=`vai jogar PlayStation!`;
        }
    }
</script>
