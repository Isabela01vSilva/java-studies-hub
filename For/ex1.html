<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="diga()">Diga algo sobre a quarentena</button><br>
    <div id="mensagem"></div>
</body>

<script>
    function diga(){
        mensagem.innerHTML='';
        for(var contador = 0; contador < 7 ; contador ++){
            mensagem.innerHTML += "Testando A minha paciencia <br>"
        }
    }
</script>
