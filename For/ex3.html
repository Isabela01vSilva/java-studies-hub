<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="contando()">Conte de 0 a 150</button><br>
    <div id="mensagem"></div>
</body>
</html>
<script>
    function contando(){
        mensagem.innerHTML='';
        for(var contador = 0; contador <= 150 ; contador ++){
            mensagem.innerHTML += `${contador}<br>`;
        }
    }
</script>
