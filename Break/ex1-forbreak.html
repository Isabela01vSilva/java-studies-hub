<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Digite um numero da sorte <input type="text" id="number"><br>
    <button onclick="sorte()">Testar minha sorte</button><br>
    <div id="mensagem"></div>
</body>
</html>
<script>
    function sorte(){
    
        for(var contador = 0 ; contador <= 20 ; contador ++){
            var sorteio = parseInt(Math.random() * 101);
          if(sorteio == number.value){
             break;
        } 
        }
        if(sorteio <= 20){
            mensagem.innerHTML += `${sorteio}<br>`;
        }
        else {
            mensagem.innerHTML += `${sorteio}<br>`;
        }
    }
</script>
