<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
        Digite os nomes dos seus filmes favoritos <input type="text" id="campofilme"><br>
        <button onclick="cadastrar()">Cadastrar</button><br>
        <div id="mensagem"></div>
</body>
</html>
<script>
  var filme = [];
    function cadastrar(){
    filme.push(campofilme.value);
    campofilme.value="";
    if(filme.length % 2 == 0){
       mensagem.innerHTML += `<span style=color:blue>${filme[filme.length-1]}</span><br>`;  
    }
    else{
       mensagem.innerHTML += `<span style=color:red>${filme[filme.length-1]}</span><br>`;  
}}
</script>
