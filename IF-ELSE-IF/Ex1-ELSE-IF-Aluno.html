<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classificar Aluno</title>
</head>
<body>
    Digite sua nota <input type="text" id="notaInformada"><br>
    <button onclick="Aluno()">Classificar Aluno</button>
</body>
</html>
<script>
    function Aluno(){
        var nota = Number(notaInformada.value);
    if(nota < 5){
    alert("Aluno precisa de muita ajuda");
    }
    else if (nota >= 5 ){
      alert("Aluno na média");
    }
    if(nota >= 7){
            alert("Aluno à acima da média");
    } 
    if(nota >= 9.5){
        alert("Aluno fora da curva")
    }
}
</script>
