<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Digite seu nome <input type="text" id="nome" onkeyup="analisar_textos()"><br>
    <div id="mensagem"></div>
</body>
</html>
<script>
    function analisar_textos(){
        mensagem.innerHTML = '';
        var campo_nome = nome.value;
        if(campo_nome.length >= 10){
            mensagem.innerHTML = 'Nome valido';
        }
        else{
            mensagem.innerHTML = 'Nome invalido';
        }
    }
</script>
