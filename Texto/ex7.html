<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Digite uma frase:<input id="frase" onkeyup="analisar_texto()" > <br>
    <div id="mensagem"></div>
</body>
</html>
<script>
    function analisar_texto(){
        mensagem.innerHTML = '';
        var campo_frase = frase.value;
        var tamanho = campo_frase.length;
        for(var contador = 0 ; contador < tamanho; contador ++){
            var frases = campo_frase[contador];
            mensagem.innerHTML += `${frases}<br>`;
        }
    }
</script>
